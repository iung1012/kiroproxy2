events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;

    # Compressão gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;

    upstream kirobug {
        server kirobug:3000;
    }

    upstream gateway {
        server kiro-gateway:8000;
    }

    server {
        listen 80;

        # ── kiro-gateway: API compatível OpenAI/Anthropic ────────────────────
        # /v1/*         → OpenAI compat  (chat completions, models)
        # /v1/messages  → Anthropic compat
        # /health       → healthcheck do gateway
        # /gateway/     → UI de status do gateway
        location /v1/ {
            proxy_pass http://gateway;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Streaming SSE
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 300s;
            chunked_transfer_encoding on;
        }

        location /health {
            proxy_pass http://gateway;
            proxy_set_header Host $host;
        }

        location /gateway/ {
            rewrite ^/gateway/(.*) /$1 break;
            proxy_pass http://gateway;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # ── kirobug: painel de gerenciamento (rota padrão) ───────────────────
        # Tudo que não for /v1/ ou /gateway/ vai para o kirobug
        location / {
            proxy_pass http://kirobug;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # WebSocket (logs em tempo real do kirobug)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 300s;
        }
    }
}
